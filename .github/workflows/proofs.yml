# The Agda proof gate (LNT-01).  Pattern: choreographic-types
# .github/workflows/proofs.yml: a digest-pinned Debian 13 container, the
# prover apt-pinned to one package version, the sibling fetched at its pinned
# commit by scripts/fetch-siblings.sh.  The only action is GitHub-owned and
# resolved through actions.lock.
name: Agda proofs
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
jobs:
  proofs:
    name: Lattice laws, pinned sibling, controls and expected rejections
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: debian:13-slim@sha256:a29215f6a35e51e22adffa17f89e9d2ef06214e64a2bad10d765c46aea49f11f
    steps:
      - name: Install the pinned prover
        run: |
          apt-get update
          apt-get install --no-install-recommends -y ca-certificates git agda-bin=2.6.4.3-1+b2
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Verify the checked Agda version
        run: test "$(agda --version)" = 'Agda version 2.6.4.3'
      # Prove the coverage instrument works before trusting its reading. The
      # gate's first claim is "every module under src/Lintel is imported by
      # Lintel.All", and a scanner that reads module names as regular
      # expressions silently mis-reports them. This suite is the control for
      # that claim; it ran nowhere in CI, which is how a red suite reached the
      # branch unnoticed.
      - name: Coverage gate self-test (must fail on drift)
        run: bash tests/check-coverage-test.sh
      - name: Leg diagnostics and correspondence self-test
        run: bash tests/legs-receipt-test.sh
      - name: Fetch siblings at their pinned commits
        run: bash scripts/fetch-siblings.sh
      - name: Proof gate
        run: bash scripts/check.sh
      # The receipt names the gate, its flags, the claim PWGs and the hashed
      # import cone (PROOF-POLICY §8). A committed receipt that no longer
      # matches the tree fails here.
      - name: Verification receipt matches the tree and the claim list
        run: bash scripts/grade-receipt.sh --check
      - name: Emit the receipt for this commit
        run: |
          bash scripts/grade-receipt.sh --write --commit "$(git rev-parse --short=12 HEAD)"
          sed -n '1,40p' verification/receipts/agda-pwg_praxis.deed
  # The Rocq and Lean recheck legs (PROOF-POLICY §2), re-proved by hand on top
  # of secret-types' own legs at the sibling pin (verification/legs/README.adoc
  # gives the route and the statement correspondence). Both provers are pinned:
  # Coq by its Ubuntu package version, Lean by its release tarball's sha256.
  # Neither leg may depend on anything but secret-types' leg, nor rest on an
  # axiom; scripts/check-legs.sh refuses either.
  legs:
    name: Rocq and Lean recheck legs (no axioms, no libraries)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install the pinned Coq
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y coq=8.18.0+dfsg-1build2 zstd
      - name: Install the pinned Lean (release tarball, sha256-checked)
        env:
          LEAN_URL: https://github.com/leanprover/lean4/releases/download/v4.24.0/lean-4.24.0-linux.tar.zst
          LEAN_SHA256: b14f5e5159219dd1a1956c3b806813319f5e94ccd5bdfd56f54520609a5bb5ec
        run: |
          set -euo pipefail
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 -fsSL "$LEAN_URL" -o "$RUNNER_TEMP/lean.tar.zst"
          echo "$LEAN_SHA256  $RUNNER_TEMP/lean.tar.zst" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/lean"
          tar --zstd -xf "$RUNNER_TEMP/lean.tar.zst" -C "$RUNNER_TEMP/lean"
          echo "$RUNNER_TEMP/lean/lean-4.24.0-linux/bin" >> "$GITHUB_PATH"
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Leg diagnostics and correspondence self-test
        run: bash tests/legs-receipt-test.sh
      - name: Fetch siblings at their pinned commits
        run: bash scripts/fetch-siblings.sh
      - name: Both legs check, with no axioms
        run: bash scripts/check-legs.sh
