# The Agda proof gate (LNT-01).  Pattern: choreographic-types
# .github/workflows/proofs.yml: a digest-pinned Debian 13 container, the
# prover apt-pinned to one package version, the sibling fetched at its pinned
# commit by scripts/fetch-siblings.sh.  The only action is GitHub-owned and
# resolved through actions.lock.
name: Agda proofs
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
# A job with a container: runs its steps with sh, not bash, unless told; the
# images here (Debian 13, Ubuntu 24.04) both ship bash, and steps use set -o
# pipefail.  GitHub runs bash as `bash --noprofile --norc -eo pipefail {0}`.
defaults:
  run:
    shell: bash
jobs:
  proofs:
    name: Lattice laws, pinned sibling, controls and expected rejections
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      matrix:
        image: [debian:13-slim@sha256:a29215f6a35e51e22adffa17f89e9d2ef06214e64a2bad10d765c46aea49f11f]
    container: ${{ matrix.image }}
    steps:
      - name: Install the pinned prover
        run: |
          apt-get update
          apt-get install --no-install-recommends -y ca-certificates curl git agda-bin=2.6.4.3-1+b2
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Verify the checked Agda version
        run: test "$(agda --version)" = 'Agda version 2.6.4.3'
      # Prove the coverage instrument works before trusting its reading. The
      # gate's first claim is "every module under src/Lintel is imported by
      # Lintel.All", and a scanner that reads module names as regular
      # expressions silently mis-reports them. This suite is the control for
      # that claim; it ran nowhere in CI, which is how a red suite reached the
      # branch unnoticed.
      - name: Coverage gate self-test (must fail on drift)
        run: bash tests/check-coverage-test.sh
      - name: Leg diagnostics and correspondence self-test
        run: bash tests/legs-receipt-test.sh
      - name: Fetch siblings at their pinned commits
        run: bash scripts/fetch-siblings.sh
      - name: Proof gate
        run: bash scripts/check.sh | tee "$RUNNER_TEMP/agda-proof.log"
      - name: Fetch the pinned tools of the standard
        run: bash scripts/grade-receipt.sh --fetch-standards
      # PROOF-POLICY §8.4 and §8.5.1: the receipt's trusted base and Agda input
      # set must be exactly what the pinned Agda reports for the graded root.
      - name: Receipt trusted base and Agda cone match the prover
        run: bash scripts/check-trusted-base.sh
      - name: Record image-bound run rows in the job log
        env:
          CHECKER_IMAGE: ${{ matrix.image }}
        run: |
          bash scripts/grade-receipt.sh --run-row agda \
            --run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" \
            --commit "$(git rev-parse HEAD)" --checker "$(agda --version)" \
            --reported "$(grep '^PASS: Lintel proofs,' "$RUNNER_TEMP/agda-proof.log")" \
            --axioms none --image "$CHECKER_IMAGE"
  # The Rocq and Lean recheck legs (PROOF-POLICY §2), re-proved by hand on top
  # of secret-types' own legs at the sibling pin (verification/legs/README.adoc
  # gives the route and the statement correspondence). Both provers are pinned:
  # Coq by its Ubuntu package version, Lean by its release tarball's sha256.
  # Neither leg may depend on anything but secret-types' leg, nor rest on an
  # axiom; scripts/check-legs.sh refuses either.  The job runs in an image
  # pinned by its digest, so the checker is isolated in the sense of
  # PROOF-POLICY §8.2 (owner ruling 2026-11-16): a bare runner's image can
  # change underneath a version-pinned prover.
  legs:
    name: Rocq and Lean recheck legs (no axioms, no libraries)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      matrix:
        image: [ubuntu:24.04@sha256:73b999393d07f2bf65a40373778a44dc9a6d54ad7718d29247d8ff9413c4d6a8]
    container: ${{ matrix.image }}
    steps:
      - name: Install the pinned Coq
        run: |
          apt-get update
          apt-get install --no-install-recommends -y ca-certificates curl git zstd coq=8.18.0+dfsg-1build2
      - name: Install the pinned Lean (release tarball, sha256-checked)
        env:
          LEAN_URL: https://github.com/leanprover/lean4/releases/download/v4.24.0/lean-4.24.0-linux.tar.zst
          LEAN_SHA256: b14f5e5159219dd1a1956c3b806813319f5e94ccd5bdfd56f54520609a5bb5ec
        run: |
          set -euo pipefail
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 -fsSL "$LEAN_URL" -o "$RUNNER_TEMP/lean.tar.zst"
          echo "$LEAN_SHA256  $RUNNER_TEMP/lean.tar.zst" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/lean"
          tar --zstd -xf "$RUNNER_TEMP/lean.tar.zst" -C "$RUNNER_TEMP/lean"
          echo "$RUNNER_TEMP/lean/lean-4.24.0-linux/bin" >> "$GITHUB_PATH"
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Leg diagnostics and correspondence self-test
        run: bash tests/legs-receipt-test.sh
      - name: Recheck gate self-test (escape hatches, pins, axiom lines)
        run: bash tests/check-legs-test.sh
      - name: Fetch siblings at their pinned commits
        run: bash scripts/fetch-siblings.sh
      - name: Both legs check, with no axioms
        run: bash scripts/check-legs.sh | tee "$RUNNER_TEMP/legs-proof.log"
      - name: Fetch the pinned tools of the standard
        run: bash scripts/grade-receipt.sh --fetch-standards
      - name: Record image-bound run rows in the job log
        env:
          CHECKER_IMAGE: ${{ matrix.image }}
        run: |
          for prover in rocq lean; do
            case "$prover" in
              rocq) checker="$(coqc --version | head -n 1)"; reported="$(grep '^PASS: Rocq leg ' "$RUNNER_TEMP/legs-proof.log")" ;;
              lean) checker="$(lean --version)"; reported="$(grep '^PASS: Lean leg ' "$RUNNER_TEMP/legs-proof.log")" ;;
            esac
            bash scripts/grade-receipt.sh --run-row "$prover" \
              --run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" \
              --commit "$(git rev-parse HEAD)" --checker "$checker" \
              --reported "$reported" --axioms none --image "$CHECKER_IMAGE"
          done
  # The proof receipt (PROOF-POLICY §8.5): the pinned reader of the standard
  # derives each grade, the shared git checker does the checks of §8.5.3, and
  # every current receipt must still describe this commit.  The git checks read
  # the history, so the checkout is full.  Bun is the release zip, pinned by
  # sha256 (the digest oven-sh publishes in SHASUMS256.txt for v1.4.2).
  receipt:
    name: Proof receipt (reader, git checks, currency)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Install the pinned Bun (release zip, sha256-checked)
        env:
          BUN_URL: https://github.com/oven-sh/bun/releases/download/bun-v1.4.2/bun-linux-x64.zip
          BUN_SHA256: 36368faef7527875d5ffa52e53cd48021741f2a83eb6208a8dd64068d422a913
        run: |
          set -euo pipefail
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 -fsSL "$BUN_URL" -o "$RUNNER_TEMP/bun.zip"
          echo "$BUN_SHA256  $RUNNER_TEMP/bun.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/bun.zip" -d "$RUNNER_TEMP/bun"
          echo "$RUNNER_TEMP/bun/bun-linux-x64" >> "$GITHUB_PATH"
      - name: Checkout (full history)
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Fetch siblings at their pinned commits
        run: bash scripts/fetch-siblings.sh
      - name: Fetch the pinned tools of the standard
        run: bash scripts/grade-receipt.sh --fetch-standards
      - name: The receipt holds
        run: bash scripts/grade-receipt.sh --check
