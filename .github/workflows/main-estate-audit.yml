# This workflow is managed by gh actions-lock.
# SPDX-License-Identifier: MPL-2.0
name: Central Estate CI/CD Audit

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_call:

# The 26 gates of hyperpolymath/proven-cicd-and-workflows' (formerly cicd-suite) main-estate-audit.yml (@55556cf),
# run inline as STEP-level composite actions pinned at 0da816c, instead of a
# job-level cross-repo `workflow_call`. The job-level call is what failed at
# startup with zero jobs; step-level composites at a full SHA are the form the
# callee itself uses. The gate set is identical to the callee's, so no gate is
# dropped. Repin on callee updates; never to PR-head commits.
jobs:
  estate-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Required Files Gate
        uses: hyperpolymath/proven-cicd-and-workflows/actions/required-files-check@0da816c05ae7486671d863e07935f93981c0c2d5
      - name: Code Hygiene Gate
        uses: hyperpolymath/proven-cicd-and-workflows/actions/code-hygiene-check@0da816c05ae7486671d863e07935f93981c0c2d5
      - name: Manifest Validation Gate
        uses: hyperpolymath/proven-cicd-and-workflows/actions/manifest-check@0da816c05ae7486671d863e07935f93981c0c2d5
      - name: Idris2 ABI Purity Gate
        uses: hyperpolymath/proven-cicd-and-workflows/actions/idris2-abi-check@0da816c05ae7486671d863e07935f93981c0c2d5
      - name: Zig Hexadeca API Gate
        uses: hyperpolymath/proven-cicd-and-workflows/actions/zig-hexadeca-check@0da816c05ae7486671d863e07935f93981c0c2d5
      - name: Contractile Validation Gate
        uses: hyperpolymath/proven-cicd-and-workflows/actions/contractile-validation-check@0da816c05ae7486671d863e07935f93981c0c2d5
      - name: Recipes Set Validation Gate
        uses: hyperpolymath/proven-cicd-and-workflows/actions/recipes-set-check@0da816c05ae7486671d863e07935f93981c0c2d5
      - name: Affirmation Document Gate
        uses: hyperpolymath/proven-cicd-and-workflows/actions/affirmation-check@0da816c05ae7486671d863e07935f93981c0c2d5
      - name: Academic Referencing Gate
        uses: hyperpolymath/proven-cicd-and-workflows/actions/referencing-check@0da816c05ae7486671d863e07935f93981c0c2d5
      - name: Semantic Audit Gate
        uses: hyperpolymath/proven-cicd-and-workflows/actions/semantic-audit-check@0da816c05ae7486671d863e07935f93981c0c2d5
      - name: SPDX License Gate
        uses: hyperpolymath/proven-cicd-and-workflows/actions/spdx-license-check@0da816c05ae7486671d863e07935f93981c0c2d5
      - name: Proof Runner Gate
        uses: hyperpolymath/proven-cicd-and-workflows/actions/proof-runner-check@0da816c05ae7486671d863e07935f93981c0c2d5
      - name: PRAT Testing Gate
        uses: hyperpolymath/proven-cicd-and-workflows/actions/prat-check@0da816c05ae7486671d863e07935f93981c0c2d5
      - name: Panic Attack & Pons Gate
        uses: hyperpolymath/proven-cicd-and-workflows/actions/custom-tools-check@0da816c05ae7486671d863e07935f93981c0c2d5
      - name: WWW & Well-Known Compliance Gate
        uses: hyperpolymath/proven-cicd-and-workflows/actions/www-compliance-check@0da816c05ae7486671d863e07935f93981c0c2d5
      - name: BoJ Cartridge Validation Gate
        uses: hyperpolymath/proven-cicd-and-workflows/actions/boj-cartridge-check@0da816c05ae7486671d863e07935f93981c0c2d5
      - name: Formatting Validation Gate
        uses: hyperpolymath/proven-cicd-and-workflows/actions/formatting-check@0da816c05ae7486671d863e07935f93981c0c2d5
      - name: Accreditations & Badges Gate
        uses: hyperpolymath/proven-cicd-and-workflows/actions/badges-check@0da816c05ae7486671d863e07935f93981c0c2d5
      - name: Metrics Extraction Gate
        uses: hyperpolymath/proven-cicd-and-workflows/actions/metrics-check@0da816c05ae7486671d863e07935f93981c0c2d5
      - name: Linguist & Banned Languages Gate
        uses: hyperpolymath/proven-cicd-and-workflows/actions/linguist-check@0da816c05ae7486671d863e07935f93981c0c2d5
      - name: Test & Benchmarks Dashboard Gate
        uses: hyperpolymath/proven-cicd-and-workflows/actions/tests-benches-check@0da816c05ae7486671d863e07935f93981c0c2d5
      - name: Hosting & Site Status Gate
        uses: hyperpolymath/proven-cicd-and-workflows/actions/hosting-check@0da816c05ae7486671d863e07935f93981c0c2d5
      - name: Git-Sea Analytics Gate
        uses: hyperpolymath/proven-cicd-and-workflows/actions/gitsea-check@0da816c05ae7486671d863e07935f93981c0c2d5
      - name: Trust & Humans Validation Gate
        uses: hyperpolymath/proven-cicd-and-workflows/actions/trust-humans-check@0da816c05ae7486671d863e07935f93981c0c2d5
      - name: Are We UnAPI Gate (Secret Scanning)
        uses: hyperpolymath/proven-cicd-and-workflows/actions/secrets-check@0da816c05ae7486671d863e07935f93981c0c2d5
      - name: Reasonably Good Token Validation Gate
        uses: hyperpolymath/proven-cicd-and-workflows/actions/vaulted-tokens-check@0da816c05ae7486671d863e07935f93981c0c2d5