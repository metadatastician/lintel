# SPDX-License-Identifier: MPL-2.0
# Dependabot configuration for RSR-compliant repositories
# Covers common ecosystems - remove unused ones for your project

version: 2
updates:
  # GitHub Actions - always include
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
    open-pull-requests-limit: 2
    ignore:
      # HOLD: github/codeql-action at v4.38.0 (SHA-pinned). v4.38.1 fails
      # GitHub workflow-startup validation estate-wide (nexia-list#100;
      # SHA-form re-bump bypassed versions-scoped ignores - see
      # nexia-list#101/#104). Hold until upstream clears 4.38.1 or a
      # newer release verifies green; revisit deliberately.
      #
      # The trailing * is load-bearing, as in standards/.github/dependabot.yml.
      # Workflows reference the SUBPATH actions (github/codeql-action/init,
      # /analyze) and Dependabot treats each subpath as its own dependency
      # name, so a bare "github/codeql-action" matches NONE of them. That is
      # how #210 bumped 4.38.0 -> 4.38.2 straight through this hold and left
      # actions.lock out of sync (#217).
      #
      # This repo no longer carries codeql.yml (default setup is on; an
      # advanced workflow's SARIF is rejected while it is). The hold stays
      # because actions.lock still records codeql-action as a TRANSITIVE
      # dependency of the standards reusables, and Dependabot rewrites lock
      # entries it did not create.
      - dependency-name: "github/codeql-action*"
      # HOLD: hyperpolymath/cicd-squabbler is pinned to a commit SHA in
      # hypatia-scan.yml, as that action's README requires. Dependabot's
      # github-actions updater narrows bare-SHA pins to the nearest tag
      # (github/gh-actions-lock#130, metadatastian/marid#36), and v0.1.0
      # predates the action directory, so a narrowed pin has no action.yml and
      # the workflow would die at job start. Bump it deliberately, together
      # with the lock entry's ref (see the comment in hypatia-scan.yml).
      - dependency-name: "hyperpolymath/cicd-squabbler*"

  # Rust/Cargo
  #
  # `open-pull-requests-limit: 0` suppresses routine version-update PRs
  # (no weekly patch-bump noise) while leaving Dependabot SECURITY PRs
  # flowing. Under GitHub's current Dependabot behaviour (2024+), using
  # an `ignore:` rule with `version-update:semver-patch` would ALSO
  # silence security PRs that happen to be patch-level — historically
  # the cause of estate-wide vulns sitting un-PR'd for weeks.
  # `open-pull-requests-limit: 0` is the GitHub-endorsed way to say
  # "security only, not routine bumps". Pair with the
  # dependabot-automerge.yml workflow for low-touch security
  # maintenance.
